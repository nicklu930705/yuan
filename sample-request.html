<!DOCTYPE html><html class="scroll-smooth" lang="zh-TW"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>樣品申請 | 侑安國際</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS Play CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-linen": "#F5F3EE",
            "on-surface": "#1b1c1a",
            "secondary": "#904d00",
            "background": "#fbf9f5",
            "surface-cream": "#FAF8F5"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface antialiased font-body-md">
<header class="w-full sticky top-0 z-50 bg-surface-cream border-b border-border-warm shadow-sm transition-all duration-200">
<div class="w-full px-gutter-lg max-w-[1360px] mx-auto flex items-center justify-between h-20">
<a class="flex items-center gap-3 group" href="index.html">
<div class="w-10 h-10 rounded-lg bg-primary-container text-surface flex items-center justify-center font-bold">侑</div>
<div class="flex flex-col"><span class="font-bold text-on-surface">侑安國際</span></div>
</a>
<nav class="hidden lg:flex items-center gap-6">
<a class="text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface transition-colors" href="index.html#products">全部商品</a>
<a class="text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface transition-colors" href="packaging.html">營業用包材</a>
<a class="text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface transition-colors" href="pest-control.html">環境衛生除蟲</a>
<a class="text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface transition-colors" href="wholesale-pricing.html">大宗箱購階梯價</a>
<a class="text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface transition-colors" href="knowledge.html">開店知識專欄</a>
<a class="text-primary font-bold border-b-2 border-primary pb-1 font-label-lg text-label-lg transition-colors" href="sample-request.html">樣品申請</a>
</nav>
</div>
</header>

<main class="py-space-3xl bg-surface">
  <div class="max-w-[800px] mx-auto px-gutter-lg">
    <div class="text-center mb-12">
      <h1 class="text-headline-lg font-headline-lg text-on-surface">免費申請實體樣品包</h1>
      <p class="text-body-lg text-on-surface-variant mt-4">小店開店不用猜尺寸與厚度！直接申請袋類全規格樣品包，寄送到店親自試裝。</p>
    </div>

    <div class="bg-white rounded-2xl border border-border-warm p-8 custom-warm-shadow">
      <form class="space-y-6" onsubmit="event.preventDefault(); alert('感謝您的申請！侑安國際客服將於 24 小時內安排樣品包寄出。');">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-on-surface mb-2">餐飲店家名稱</label>
            <input class="w-full px-4 py-3 bg-surface border border-border-warm rounded-xl focus:ring-1 focus:ring-primary focus:outline-none" placeholder="例如：侑安早午餐" required="" type="text">
          </div>
          <div>
            <label class="block text-sm font-bold text-on-surface mb-2">負責人聯絡電話</label>
            <input class="w-full px-4 py-3 bg-surface border border-border-warm rounded-xl focus:ring-1 focus:ring-primary focus:outline-none" placeholder="0912-345-678" required="" type="text">
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold text-on-surface mb-2">欲索取試裝類別</label>
          <select class="w-full px-4 py-3 bg-surface border border-border-warm rounded-xl focus:ring-1 focus:ring-primary focus:outline-none">
            <option>營業用耐熱袋綜合樣品包 (4兩~3斤)</option>
            <option>特厚防穿刺垃圾袋測試組</option>
            <option>密封加厚夾鏈袋全尺寸組</option>
            <option>全系列營業耗材樣品全套</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold text-on-surface mb-2">寄送門市地址</label>
          <input class="w-full px-4 py-3 bg-surface border border-border-warm rounded-xl focus:ring-1 focus:ring-primary focus:outline-none" placeholder="完整寄送地址" required="" type="text">
        </div>
        <button class="w-full py-4 bg-[#D97706] hover:bg-[#B45309] text-white rounded-xl font-bold text-lg shadow-sm transition-all active:scale-[0.98]" type="submit">
          確認索取（免收運費）
        </button>
        <p class="text-sm text-center text-slate-muted">每間營業登記店家限申請乙次，由新北物流中心掛號配送</p>
      </form>
    </div>
  </div>
</main>

<footer class="w-full bg-surface-linen border-t border-border-warm py-12 text-center">
  <p class="text-body-sm text-on-surface-variant">© 2026 侑安國際有限公司</p>
</footer>
</body></html>
